# The free host puts the site to sleep after 15 minutes with no visitors, and
# waking it takes about 40 seconds — long enough that a student's phone gives up
# and shows "could not reach the shop". A knock every 10 minutes keeps it up.
name: Keep the shop awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  knock:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the site
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
              https://printout-w5pr.onrender.com/api/config) || code=000
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "site did not answer after three tries"
          exit 1
