<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Printout — shop counter</title>
    <link rel="icon" href="mark.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="mark-inverse.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#15171b" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap wrap--wide hidden" id="queue-view">
      <header class="masthead">
        <h1><img class="mark" src="mark.svg" alt="" width="30" height="30" />Print<em>out</em> Queue</h1>
        <p><span id="live">Refreshing every 15s</span> · <button class="tab theme-toggle" type="button">Dark</button> · <button class="tab" id="logout" type="button">Sign out</button></p>
      </header>

      <div class="tabs" id="tabs">
        <button class="tab is-active" data-status="pending" type="button">Waiting <b>0</b></button>
        <button class="tab" data-status="prepaid" type="button">Prepaid <b>0</b></button>
        <button class="tab" data-status="printed" type="button">Printed <b>0</b></button>
        <button class="tab" data-status="collected" type="button">Collected <b>0</b></button>
        <button class="tab" data-status="all" type="button">Everything</button>
      </div>

      <div class="jobs" id="jobs"></div>
    </main>

    <main class="wrap signin hidden" id="signin-view">
      <header class="masthead">
        <h1><img class="mark" src="mark.svg" alt="" width="30" height="30" />Print<em>out</em> Login</h1>
        <p><button class="tab theme-toggle" type="button">Dark</button></p>
      </header>
      <div class="alert" id="signin-error" role="alert"></div>
      <form class="ticket" id="signin-form">
        <div class="field">
          <label for="password">Counter password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn--block" type="submit">Open the queue</button>
      </form>
    </main>

    <script src="shop.js"></script>
  </body>
</html>
